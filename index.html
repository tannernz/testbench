<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>NZ Zone Lookup + Directions (OSM)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <style>
    :root {
      --bg-color:#ffffff; --text-color:#333; --input-bg:#fff; --input-border:#ccc;
      --button-bg:#f0f0f0; --button-hover:#e0e0e0; --warning-bg:#FF0000; --warning-text:#FFF;
      --scroll-bg:rgba(255,255,255,0.95); --zone-color:#FF0000; --result-color:#333;
      --sidebar-bg:#f8f9fa; --sidebar-border:#dee2e6; --highlight-color:#007bff;
      --good-color:#28a745; --warning-color:#ffc107; --danger-color:#dc3545;
    }
    .dark-mode {
      --bg-color:#121212; --text-color:#e0e0e0; --input-bg:#2d2d2d; --input-border:#444;
      --button-bg:#3a3a3a; --button-hover:#4a4a4a; --warning-bg:#cc0000; --warning-text:#fff;
      --scroll-bg:rgba(30,30,30,0.95); --zone-color:#ff6666; --result-color:#e0e0e0;
      --sidebar-bg:#2d2d2d; --sidebar-border:#444; --highlight-color:#39f;
    }
    body { background:var(--bg-color); color:var(--text-color); margin:0; padding:0;
      min-height:100vh; display:flex; flex-direction:column;
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
      transition:background-color .3s,color .3s; }

    #map { height:75vh; width:100%; flex-grow:1; z-index:1; }

    #controls { margin:10px; text-align:center; padding:15px; background:var(--bg-color); position:relative; z-index:2; }

    #address, #to { font-size:16px; padding:12px; width:320px; max-width:90%; margin:5px;
      background:var(--input-bg); color:var(--text-color); border:2px solid var(--input-border);
      border-radius:4px; box-sizing:border-box; }

    #controls button { font-size:16px; padding:12px 22px; margin:5px; cursor:pointer;
      background:var(--button-bg); color:var(--text-color); border:2px solid var(--input-border);
      border-radius:4px; }
    #controls button:hover { background:var(--button-hover); }

    #result { font-size:18px; font-weight:600; margin-top:10px; color:var(--result-color); text-align:center; }
    #zone-info { font-size:24px; font-weight:bold; margin-top:10px; color:var(--zone-color); text-align:center; }

    #warning { font-size:22px; font-weight:bold; margin-top:10px; color:var(--warning-text);
      text-align:center; background:var(--warning-bg); padding:10px 20px; border-radius:5px; display:inline-block; }
    #loading-warning { font-size:15px; margin-top:5px; color:var(--text-color); opacity:.7; text-align:center; display:none; }

    #route-alternatives { margin-top:10px; text-align:center; }
    .route-option { display:inline-block; margin:5px; padding:8px 16px; background:var(--button-bg);
      color:var(--text-color); border:2px solid var(--input-border); border-radius:5px;
      cursor:pointer; font-size:15px; }
    .route-option:hover { background:var(--button-hover); }
    .route-option.selected { background:#4CAF50; color:#fff; border-color:#45a049; }

    #dark-mode-toggle { position:fixed; top:15px; right:15px; z-index:1001; background:var(--button-bg);
      color:var(--text-color); border:2px solid var(--input-border); border-radius:50%;
      width:50px; height:50px; font-size:20px; cursor:pointer; display:flex;
      align-items:center; justify-content:center; box-shadow:0 2px 10px rgba(0,0,0,.2); }

    #survey-calculator { position:fixed; top:80px; right:20px; width:380px; background:var(--sidebar-bg);
      border:2px solid var(--sidebar-border); border-radius:10px; padding:20px; z-index:1000;
      box-shadow:0 4px 15px rgba(0,0,0,.1); display:none; max-height:calc(100vh - 120px); overflow-y:auto; }
    #survey-calculator.show { display:block; }
    .calculator-header { display:flex; justify-content:space-between; align-items:center;
      margin-bottom:15px; padding-bottom:10px; border-bottom:2px solid var(--sidebar-border); }
    .calculator-header h3 { margin:0; color:var(--highlight-color); font-size:18px; }
    .close-calculator { background:none; border:none; font-size:24px; cursor:pointer; color:var(--text-color); }
    .calculator-inputs { display:grid; gap:15px; margin-bottom:20px; }
    .input-group { display:flex; flex-direction:column; gap:5px; }
    .input-group label { font-weight:600; font-size:14px; }
    .input-group select { padding:10px; border:2px solid var(--input-border); border-radius:5px;
      background:var(--input-bg); color:var(--text-color); font-size:16px; }
    .calculator-results { background:var(--bg-color); border-radius:8px; padding:15px; margin-top:20px; }
    .survey-time { font-size:20px; font-weight:bold; color:var(--highlight-color); text-align:center;
      padding:10px; border-radius:6px; background:rgba(0,123,255,.1); margin-bottom:15px; }
    .survey-recommendation { font-size:18px; font-weight:bold; text-align:center; margin:15px 0;
      padding:12px; border-radius:6px; background:rgba(40,167,69,.1); color:var(--good-color); }
    .survey-schedule { display:grid; gap:10px; margin-top:20px; }
    .schedule-item { display:flex; justify-content:space-between; align-items:center;
      padding:10px 12px; border-radius:6px; background:var(--button-bg); border:2px solid transparent;
      flex-wrap:wrap; }
    .schedule-item.recommended { background:rgba(40,167,69,.2); border-color:var(--good-color); }
    .slot-number { font-weight:bold; font-size:15px; color:var(--highlight-color); }
    .slot-time { font-size:13px; }
    .slot-status { font-size:11px; padding:3px 8px; border-radius:12px; background:var(--highlight-color); color:#fff; }
    .slot-status.recommended { background:var(--good-color); }
    .survey-note { margin-top:20px; padding:12px; background:rgba(255,193,7,.1); border-radius:6px;
      border-left:3px solid var(--warning-color); font-size:13px; }
    .case-by-case-warning { background:rgba(220,53,69,.1) !important; border-left-color:var(--danger-color) !important;
      color:var(--danger-color) !important; }

    .calculator-trigger { position:fixed; top:140px; right:20px; z-index:1000;
      background:var(--highlight-color); color:#fff; border:none; border-radius:50%;
      width:40px; height:40px; font-size:18px; cursor:pointer; display:none;
      align-items:center; justify-content:center; box-shadow:0 2px 10px rgba(0,0,0,.2); }
    .calculator-trigger.show { display:flex; }

    .zone-display { font-size:16px; font-weight:bold; color:var(--zone-color); text-align:center;
      margin-bottom:15px; padding:8px; background:rgba(255,0,0,.1); border-radius:6px; }

    .scroll-text { position:fixed; bottom:0; left:0; right:0; background:var(--scroll-bg);
      padding:6px 0; font-size:26px; font-weight:bold; white-space:nowrap; overflow:hidden; z-index:9999; }
    .scroll-track { display:inline-block; white-space:nowrap; animation:moveLeft 35s linear infinite; padding-left:100%; }
    @keyframes moveLeft { 0%{transform:translateX(100%);} 100%{transform:translateX(-100%);} }
    @keyframes colorCycle { 0%{color:red;} 25%{color:orange;} 50%{color:lime;} 75%{color:cyan;} 100%{color:red;} }
    .scroll-track span { animation:colorCycle 4s linear infinite; }
    .truck svg { height:36px; margin-right:12px; vertical-align:middle; }

    .autocomplete-items { position:absolute; border:1px solid var(--input-border); border-top:none;
      z-index:99; top:100%; left:0; right:0; background:var(--input-bg); max-height:250px;
      overflow-y:auto; border-radius:0 0 4px 4px; box-shadow:0 4px 8px rgba(0,0,0,.1); }
    .autocomplete-items div { padding:10px 12px; cursor:pointer; border-bottom:1px solid var(--input-border);
      font-size:14px; text-align:left; }
    .autocomplete-items div:hover { background:var(--button-hover); }
    .input-wrapper { position:relative; display:inline-block; width:320px; max-width:90%; }
    .input-wrapper input { width:100% !important; margin:5px 0 !important; }

    /* Leaflet dark-mode filter (invert tiles) */
    .dark-mode .leaflet-tile-pane { filter: invert(1) hue-rotate(180deg) brightness(.85) contrast(.9); }
    .dark-mode .leaflet-container { background:#1a1a1a; }

    @media (max-width:768px) {
      #survey-calculator { width:calc(100% - 40px); left:20px; right:20px; }
      #address, #to, .input-wrapper { width:100%; }
    }
  </style>
</head>
<body>

  <button id="dark-mode-toggle" title="Toggle Dark Mode">🌙</button>
  <button id="calculator-trigger" class="calculator-trigger" title="Survey Time Calculator">⏱️</button>

  <div id="survey-calculator">
    <div class="calculator-header">
      <h3>🏠 Survey Time Calculator</h3>
      <button class="close-calculator">×</button>
    </div>
    <div class="zone-display" id="calculator-zone">Detected Zone: --</div>
    <div class="calculator-inputs">
      <div class="input-group">
        <label>Number of Bedrooms:</label>
        <select id="bedrooms">
          <option value="1">1 Bedroom</option>
          <option value="2" selected>2 Bedrooms</option>
          <option value="3">3 Bedrooms</option>
          <option value="4">4 Bedrooms</option>
          <option value="5">5+ Bedrooms</option>
        </select>
      </div>
      <div class="input-group">
        <label>Number of Living Areas:</label>
        <select id="living-areas">
          <option value="0">0 Living Areas</option>
          <option value="1" selected>1 Living Area</option>
          <option value="2">2 Living Areas</option>
          <option value="3">3+ Living Areas</option>
        </select>
      </div>
    </div>
    <div class="calculator-results">
      <div class="survey-time" id="estimated-time">Estimated Survey Time: --</div>
      <div class="survey-recommendation" id="recommended-slot">Recommended Slot: --</div>
      <div class="survey-schedule" id="schedule-display"></div>
      <div class="survey-note" id="survey-notes">
        <strong>Note:</strong> Times are estimates. Adjust bookings based on actual property size.
      </div>
    </div>
  </div>

  <div id="controls">
    <form onsubmit="handleSearch(); return false;">
      <div class="input-wrapper">
        <input id="address" type="text" placeholder="Enter first NZ address" autocomplete="off">
        <div id="address-autocomplete" class="autocomplete-items" style="display:none;"></div>
      </div>
      <div class="input-wrapper">
        <input id="to" type="text" placeholder="Enter second NZ address (optional)" autocomplete="off">
        <div id="to-autocomplete" class="autocomplete-items" style="display:none;"></div>
      </div>
      <br>
      <button type="submit">Search</button>
      <button type="button" onclick="clearSearch()">Clear Search</button>
    </form>

    <div id="zone-info"></div>
    <p id="result"></p>
    <div id="route-alternatives"></div>
    <div style="text-align:center;"><span id="warning" style="display:none;">Warning - Local</span></div>
    <p id="loading-warning">Checking road distance to nearest branch...</p>
  </div>

  <div id="map"></div>

  <div class="scroll-text">
    <div class="scroll-track">
      <span class="truck">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 120" width="160" height="60" style="transform:scaleX(-1);">
          <rect x="10" y="40" width="200" height="50" rx="6" ry="6" fill="#e10600"/>
          <rect x="222" y="50" width="28" height="35" rx="4" ry="4" fill="#e10600"/>
          <polygon points="250,50 270,60 270,85 250,85" fill="#e10600"/>
          <rect x="226" y="55" width="22" height="15" rx="2" ry="2" fill="#fff" opacity=".85"/>
          <circle cx="50" cy="95" r="12" fill="#111"/>
          <circle cx="100" cy="95" r="12" fill="#111"/>
          <circle cx="150" cy="95" r="12" fill="#111"/>
          <circle cx="200" cy="95" r="12" fill="#111"/>
          <circle cx="235" cy="95" r="12" fill="#111"/>
          <circle cx="260" cy="95" r="12" fill="#111"/>
        </svg>
      </span>
      <span>m</span><span>a</span><span>d</span><span>e</span>
      <span> </span><span>b</span><span>y</span><span> </span>
      <span>t</span><span>a</span><span>n</span><span>n</span><span>e</span><span>r</span>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/@turf/turf@6/turf.min.js"></script>

  <script>
    // ============ DARK MODE ============
    const darkModeToggle = document.getElementById('dark-mode-toggle');
    const prefersDark = window.matchMedia('(prefers-color-scheme: dark)');
    const savedTheme = localStorage.getItem('theme') || (prefersDark.matches ? 'dark' : 'light');
    if (savedTheme === 'dark') {
      document.body.classList.add('dark-mode');
      darkModeToggle.textContent = '☀️';
    }
    darkModeToggle.addEventListener('click', () => {
      document.body.classList.toggle('dark-mode');
      const isDark = document.body.classList.contains('dark-mode');
      localStorage.setItem('theme', isDark ? 'dark' : 'light');
      darkModeToggle.textContent = isDark ? '☀️' : '🌙';
    });

    // ============ GLOBAL STATE ============
    let map;
    let polygons = [];              // { layer, name, geojson }
    let currentMarkers = [];        // Leaflet markers for start/end
    let routeLayers = [];           // polylines for routes
    let currentRoutes = [];         // array of { coords, distance, duration }
    let selectedRouteIndex = 0;
    let startLocation = null;       // { lat, lng }
    let destLocation = null;
    let startZone = null;
    let destZone = null;
    let currentZoneForCalculator = null;
    let currentZoneName = '';

    // ============ DATA ============
    const branchLocations = [
      { lat: -36.7512, lng: 174.7062, title: "200 Bush Road, Albany" },
      { lat: -37.7375, lng: 175.2207, title: "62/68 The Boulevard, Hamilton" },
      { lat: -37.6645, lng: 176.2069, title: "141 Newton Street, Mt Maunganui" },
      { lat: -40.3410, lng: 175.5956, title: "17 Bennett Street, Palmerston North" },
      { lat: -41.2494, lng: 174.9099, title: "65 Seaview Road, Lower Hutt" },
      { lat: -41.3020, lng: 173.2230, title: "4 Tokomaru Place, Nelson" },
      { lat: -43.5333, lng: 172.5500, title: "15 Foremans Road, Christchurch" },
      { lat: -45.8742, lng: 170.5036, title: "32 McNab Street, Dunedin" }
    ];

    const consultantLocations = [
      { lat: -36.7193, lng: 174.7367, title: "Consultant - Browns Bay" },
      { lat: -36.6850, lng: 174.7410, title: "Consultant - Long Bay" },
      { lat: -37.6500, lng: 175.5167, title: "Consultant - Morrinsville" },
      { lat: -37.6973, lng: 176.2846, title: "Consultant - Papamoa Beach" },
      { lat: -40.9167, lng: 175.0167, title: "Consultant - Paraparaumu" },
      { lat: -43.5833, lng: 172.3833, title: "Consultant - Rolleston" }
    ];

    // ============ MAP INIT ============
    function initMap() {
      map = L.map('map', { zoomControl: true }).setView([-40.9, 174.9], 5);

      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '© OpenStreetMap contributors'
      }).addTo(map);

      // Add scale bar
      L.control.scale({ imperial: false }).addTo(map);

      // Branch markers (red building emoji)
      branchLocations.forEach(b => {
        L.marker([b.lat, b.lng], {
          icon: L.divIcon({
            className: 'branch-marker',
            html: '<div style="font-size:22px;line-height:22px;">🏢</div>',
            iconSize: [22, 22],
            iconAnchor: [11, 11]
          })
        }).addTo(map).bindPopup(b.title);
      });

      // Consultant markers (person emoji)
      consultantLocations.forEach(c => {
        L.marker([c.lat, c.lng], {
          icon: L.divIcon({
            className: 'consultant-marker',
            html: '<div style="font-size:20px;line-height:20px;">👤</div>',
            iconSize: [20, 20],
            iconAnchor: [10, 10]
          })
        }).addTo(map).bindPopup(c.title);
      });

      // Load zones
      loadZones();
    }

    function loadZones() {
      fetch("zones.geojson", { cache: "no-cache" })
        .then(res => res.json())
        .then(data => {
          data.features.forEach(feature => {
            const name = feature.properties.name || "Unnamed";
            const layer = L.geoJSON(feature, {
              style: {
                color: "#FF6666",
                weight: 2,
                opacity: 0.6,
                fillColor: "#FF6666",
                fillOpacity: 0.05
              }
            }).addTo(map);
            polygons.push({ layer, name, geojson: feature });
          });
        })
        .catch(err => console.error("Error loading zones.geojson:", err));
    }

    // ============ GEOCODING (Nominatim) ============
    // Nominatim usage policy: max 1 req/sec, provide a valid identifier.
    let lastGeocodeTime = 0;
    async function geocodeAddress(query) {
      const now = Date.now();
      const wait = Math.max(0, 1000 - (now - lastGeocodeTime));
      if (wait > 0) await new Promise(r => setTimeout(r, wait));
      lastGeocodeTime = Date.now();

      const url = `https://nominatim.openstreetmap.org/search?format=json&countrycodes=nz&limit=1&q=${encodeURIComponent(query)}`;
      const res = await fetch(url, {
        headers: { 'Accept': 'application/json' }
      });
      const data = await res.json();
      if (!data || data.length === 0) return null;
      return {
        lat: parseFloat(data[0].lat),
        lng: parseFloat(data[0].lon),
        displayName: data[0].display_name
      };
    }

    // ============ AUTOCOMPLETE (Nominatim) ============
    function setupAutocomplete(inputId, dropdownId) {
      const input = document.getElementById(inputId);
      const dropdown = document.getElementById(dropdownId);
      let timer = null;
      let lastQueryTime = 0;

      input.addEventListener('input', () => {
        const q = input.value.trim();
        clearTimeout(timer);
        if (q.length < 3) { dropdown.style.display = 'none'; return; }

        timer = setTimeout(async () => {
          // Rate limit: 1 req/sec to Nominatim
          const now = Date.now();
          const wait = Math.max(0, 1100 - (now - lastQueryTime));
          if (wait > 0) await new Promise(r => setTimeout(r, wait));
          lastQueryTime = Date.now();

          try {
            const url = `https://nominatim.openstreetmap.org/search?format=json&countrycodes=nz&limit=6&q=${encodeURIComponent(q)}`;
            const res = await fetch(url, { headers: { 'Accept': 'application/json' } });
            const data = await res.json();

            if (!data || data.length === 0) { dropdown.style.display = 'none'; return; }

            dropdown.innerHTML = '';
            data.forEach(item => {
              const div = document.createElement('div');
              div.textContent = item.display_name;
              div.addEventListener('click', () => {
                input.value = item.display_name;
                dropdown.style.display = 'none';
              });
              dropdown.appendChild(div);
            });
            dropdown.style.display = 'block';
          } catch (e) {
            console.error('Autocomplete error:', e);
          }
        }, 350);
      });

      // Hide on blur (delayed so click registers)
      input.addEventListener('blur', () => {
        setTimeout(() => { dropdown.style.display = 'none'; }, 200);
      });

      input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
          e.preventDefault();
          dropdown.style.display = 'none';
          handleSearch();
        }
      });
    }

    // ============ ROUTING (OSRM) ============
    // OSRM public demo server. For production, host your own.
    async function getRoutes(start, end) {
      const url = `https://router.project-osrm.org/route/v1/driving/` +
                  `${start.lng},${start.lat};${end.lng},${end.lat}` +
                  `?overview=full&geometries=geojson&alternatives=true&steps=false`;
      const res = await fetch(url);
      const data = await res.json();
      if (!data.routes || data.routes.length === 0) return [];
      return data.routes.map(r => ({
        coords: r.geometry.coordinates.map(c => [c[1], c[0]]), // [lat,lng]
        distance: r.distance, // meters
        duration: r.duration  // seconds
      }));
    }

    // Distance from A to B (road) — single route
    async function getRoadDistance(start, end) {
      const routes = await getRoutes(start, end);
      if (routes.length === 0) return Infinity;
      return routes[0].distance; // meters
    }

    // ============ ZONE LOOKUP ============
    function getZone(lat, lng) {
      const pt = turf.point([lng, lat]);
      let found = null;
      for (const p of polygons) {
        if (turf.booleanPointInPolygon(pt, p.geojson)) {
          found = p.name;
        }
      }
      return found || "Outside all zones";
    }

    // ============ MARKERS ============
    function clearMarkers() {
      currentMarkers.forEach(m => map.removeLayer(m));
      currentMarkers = [];
    }

    function placeMarker(lat, lng, isStart) {
      const color = isStart ? '#0000FF' : '#00FF00';
      const label = isStart ? 'S' : 'E';
      const marker = L.marker([lat, lng], {
        icon: L.divIcon({
          className: 'pin-marker',
          html: `<div style="background:${color};width:22px;height:22px;border-radius:50%;border:2px solid #000;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:bold;font-size:12px;">${label}</div>`,
          iconSize: [22, 22],
          iconAnchor: [11, 11]
        })
      }).addTo(map);
      currentMarkers.push(marker);
    }

    // ============ SEARCH HANDLERS ============
    async function handleSearch() {
      const address1 = document.getElementById("address").value.trim();
      const address2 = document.getElementById("to").value.trim();

      if (!address1) {
        document.getElementById("result").textContent = "Please enter at least the first address.";
        return;
      }

      if (!address2) {
        await lookupZoneOnly(address1);
      } else {
        await calcRoute(address1, address2);
      }
    }

    async function lookupZoneOnly(address) {
      document.getElementById("result").textContent = "Looking up…";
      const loc = await geocodeAddress(address);
      if (!loc) {
        document.getElementById("result").textContent = "Address not found.";
        return;
      }

      clearMarkers();
      clearRoutes();
      document.getElementById("route-alternatives").innerHTML = "";
      placeMarker(loc.lat, loc.lng, true);
      startLocation = { lat: loc.lat, lng: loc.lng };

      const zone = getZone(loc.lat, loc.lng);
      startZone = zone;

      document.getElementById("zone-info").innerHTML =
        `Zone: <span style="color:var(--zone-color); font-weight:bold;">${zone}</span>`;
      document.getElementById("result").textContent = `Address: ${loc.displayName}`;
      document.getElementById("warning").style.display = "none";

      checkIfShowCalculator(zone, true);

      map.setView([loc.lat, loc.lng], 12);
    }

    async function calcRoute(address1, address2) {
      document.getElementById("result").textContent = "Geocoding addresses…";

      const [loc1, loc2] = await Promise.all([
        geocodeAddress(address1),
        geocodeAddress(address2)
      ]);

      if (!loc1) { document.getElementById("result").textContent = "First address not found."; return; }
      if (!loc2) { document.getElementById("result").textContent = "Second address not found."; return; }

      startLocation = { lat: loc1.lat, lng: loc1.lng };
      destLocation  = { lat: loc2.lat, lng: loc2.lng };

      startZone = getZone(loc1.lat, loc1.lng);
      destZone  = getZone(loc2.lat, loc2.lng);

      document.getElementById("zone-info").innerHTML =
        `Zones: <span style="color:var(--zone-color); font-weight:bold;">${startZone}</span> ` +
        `<span style="font-weight:bold; text-decoration:underline;">to</span> ` +
        `<span style="color:var(--zone-color); font-weight:bold;">${destZone}</span>`;

      checkIfShowCalculator(startZone, true);

      document.getElementById("result").textContent = "Calculating routes…";

      const routes = await getRoutes(startLocation, destLocation);
      if (routes.length === 0) {
        document.getElementById("result").textContent = "No route found.";
        return;
      }

      currentRoutes = routes;
      selectedRouteIndex = 0;

      displayRoute(0);
      displayRouteAlternatives(routes);

      // Only check local warning if both are 'local'
      checkLocalWarning();
    }

    // ============ ROUTE DISPLAY ============
    function clearRoutes() {
      routeLayers.forEach(l => map.removeLayer(l));
      routeLayers = [];
      currentRoutes = [];
      selectedRouteIndex = 0;
    }

    function displayRoute(index) {
      if (!currentRoutes[index]) return;
      // Remove previous polylines
      routeLayers.forEach(l => map.removeLayer(l));
      routeLayers = [];

      const route = currentRoutes[index];
      const poly = L.polyline(route.coords, {
        color: '#007bff',
        weight: 5,
        opacity: 0.8
      }).addTo(map);
      routeLayers.push(poly);

      clearMarkers();
      placeMarker(startLocation.lat, startLocation.lng, true);
      placeMarker(destLocation.lat, destLocation.lng, false);

      const distKm = (route.distance / 1000).toFixed(1);
      const durMin = Math.round(route.duration / 60);
      const durTxt = durMin >= 60
        ? `${Math.floor(durMin/60)} h ${durMin%60} min`
        : `${durMin} min`;

      document.getElementById("result").innerHTML =
        `Distance: ${distKm} km | Duration: ${durTxt}`;

      const bounds = L.latLngBounds(route.coords);
      map.fitBounds(bounds, { padding: [30, 30] });
    }

    function displayRouteAlternatives(routes) {
      const div = document.getElementById("route-alternatives");
      div.innerHTML = "<strong>Route Options:</strong><br>";
      routes.forEach((route, index) => {
        const distKm = (route.distance / 1000).toFixed(1);
        const durMin = Math.round(route.duration / 60);
        const durTxt = durMin >= 60
          ? `${Math.floor(durMin/60)} h ${durMin%60} min`
          : `${durMin} min`;

        const el = document.createElement("div");
        el.className = `route-option ${index === 0 ? 'selected' : ''}`;
        el.innerHTML = `Route ${index+1}: ${distKm} km • ${durTxt}`;
        el.onclick = () => selectRoute(index);
        div.appendChild(el);
      });
    }

    function selectRoute(index) {
      selectedRouteIndex = index;
      document.querySelectorAll('.route-option').forEach((opt, i) => {
        opt.classList.toggle('selected', i === index);
      });
      displayRoute(index);
    }

    // ============ LOCAL DISTANCE CHECK ============
    function straightLineKm(a, b) {
      const from = turf.point([a.lng, a.lat]);
      const to = turf.point([b.lng, b.lat]);
      return turf.distance(from, to, { units: 'kilometers' });
    }

    async function checkLocationLocal(location) {
      // Find nearest branch by straight-line first
      let closest = null;
      let minKm = Infinity;
      for (const b of branchLocations) {
        const km = straightLineKm(location, { lat: b.lat, lng: b.lng });
        if (km < minKm) { minKm = km; closest = b; }
      }
      // If it's over 50 km straight-line, definitely not local. Skip OSRM call.
      if (minKm >= 50) return false;
      if (!closest) return false;

      try {
        const meters = await getRoadDistance(location, { lat: closest.lat, lng: closest.lng });
        return meters <= 35000; // 35 km
      } catch (e) {
        console.error("Road distance check failed:", e);
        // Fallback to straight-line distance
        return minKm <= 35;
      }
    }

    async function checkLocalWarning() {
      const warningEl = document.getElementById("warning");
      const loadingEl = document.getElementById("loading-warning");

      if (!startLocation || !destLocation) {
        warningEl.style.display = "none";
        return;
      }

      loadingEl.style.display = "block";
      warningEl.style.display = "none";

      const [startLocal, destLocal] = await Promise.all([
        checkLocationLocal(startLocation),
        checkLocationLocal(destLocation)
      ]);

      loadingEl.style.display = "none";
      warningEl.style.display = (startLocal && destLocal) ? "inline-block" : "none";
    }

    // ============ CLEAR ============
    function clearSearch() {
      document.getElementById("address").value = "";
      document.getElementById("to").value = "";
      document.getElementById("address-autocomplete").style.display = "none";
      document.getElementById("to-autocomplete").style.display = "none";
      document.getElementById("result").textContent = "";
      document.getElementById("zone-info").textContent = "";
      document.getElementById("warning").style.display = "none";
      document.getElementById("loading-warning").style.display = "none";
      document.getElementById("route-alternatives").innerHTML = "";

      clearMarkers();
      clearRoutes();

      startLocation = null; destLocation = null;
      startZone = null; destZone = null;

      calculatorTrigger.classList.remove('show');
      surveyCalculator.classList.remove('show');

      const note = document.getElementById('survey-note');
      if (note) note.remove();

      map.setView([-40.9, 174.9], 5);
    }

    // ============ SURVEY CALCULATOR (unchanged logic) ============
    const calculatorTrigger = document.getElementById('calculator-trigger');
    const surveyCalculator = document.getElementById('survey-calculator');
    const closeCalculator = document.querySelector('.close-calculator');
    const bedroomsSelect = document.getElementById('bedrooms');
    const livingAreasSelect = document.getElementById('living-areas');
    const estimatedTimeElement = document.getElementById('estimated-time');
    const recommendedSlotElement = document.getElementById('recommended-slot');
    const scheduleDisplayElement = document.getElementById('schedule-display');
    const calculatorZoneElement = document.getElementById('calculator-zone');
    const surveyNotesElement = document.getElementById('survey-notes');

    calculatorTrigger.addEventListener('click', () => {
      surveyCalculator.classList.toggle('show');
      updateCalculator();
    });
    closeCalculator.addEventListener('click', () => surveyCalculator.classList.remove('show'));

    const zoneSurveyTimes = {
      'Zone 1': '10:30am', 'Zone 2A': '11:00am', 'Zone 2B': '11:00am',
      'Zone 3': '10:30am', 'Zone 4': '10:30am', 'Zone 5': '10:30am'
    };

    function calculateSurveyTime(bedrooms, livingAreas) {
      const bd = parseInt(bedrooms), la = parseInt(livingAreas);
      if (bd <= 2) return { time: '45 mins', code: 'short' };
      if (bd === 3 && la === 1) return { time: '1 hour', code: 'medium' };
      if ((bd === 3 && la >= 2) || (bd === 4 && la === 1)) return { time: '1 hour 15 mins', code: 'long' };
      if (bd === 4 && la >= 2) return { time: '1 hour 30 mins', code: 'xlong' };
      if (bd >= 5) return { time: 'Case-by-case', code: 'special' };
      return { time: '45 mins', code: 'short' };
    }

    function recommendSurveySlot(surveyTimeCode, zone) {
      let secondSurveyTime = '10:30am';
      if (zone === 'Zone 2A' || zone === 'Zone 2B') secondSurveyTime = '11:00am';
      else if (zone && zoneSurveyTimes[zone]) secondSurveyTime = zoneSurveyTimes[zone];

      const slots = [
        { number:1, name:'First Survey',  time:'0845am', note:'usually video, physical if in Paraparaumu' },
        { number:2, name:'Second Survey', time:secondSurveyTime, note:'' },
        { number:3, name:'Third Survey',  time:'11:45am - 12:30pm', note:'depending on previous survey size' },
        { number:4, name:'Fourth Survey', time:'1pm - 2pm', note:'depending on previous survey size' },
        { number:5, name:'Last Survey',   time:'3pm - 4pm', note:'depending on previous survey size' }
      ];

      if (surveyTimeCode === 'special') {
        return { recommendedSlot: 5, slots, note: 'Case-by-case assessment. Recommend LAST slot.' };
      }

      let recommended;
      if (surveyTimeCode === 'short') recommended = 2;
      else if (surveyTimeCode === 'medium') recommended = 3;
      else if (surveyTimeCode === 'long') recommended = 4;
      else if (surveyTimeCode === 'xlong') recommended = 5;
      else recommended = 3;

      return { recommendedSlot: recommended, slots };
    }

    function updateCalculator() {
      const bedrooms = parseInt(bedroomsSelect.value);
      const livingAreas = parseInt(livingAreasSelect.value);

      if (!currentZoneForCalculator) {
        estimatedTimeElement.textContent = 'Please enter an address first';
        recommendedSlotElement.textContent = 'No zone detected';
        return;
      }

      const surveyTime = calculateSurveyTime(bedrooms, livingAreas);
      estimatedTimeElement.textContent = `Estimated Survey Time: ${surveyTime.time}`;

      const rec = recommendSurveySlot(surveyTime.code, currentZoneForCalculator);
      recommendedSlotElement.textContent = `Recommended Slot: ${rec.slots[rec.recommendedSlot - 1].name}`;

      scheduleDisplayElement.innerHTML = '<h4>Daily Survey Schedule:</h4>';
      rec.slots.forEach((slot, index) => {
        const slotEl = document.createElement('div');
        slotEl.className = `schedule-item ${index + 1 === rec.recommendedSlot ? 'recommended' : ''}`;
        slotEl.innerHTML = `
          <div class="slot-number">${slot.number}. ${slot.name}</div>
          <div class="slot-time">${slot.time}</div>
          <div class="slot-status ${index + 1 === rec.recommendedSlot ? 'recommended' : ''}">
            ${index + 1 === rec.recommendedSlot ? 'RECOMMENDED' : ''}
          </div>`;
        if (slot.note) {
          const n = document.createElement('div');
          n.style.cssText = 'font-size:11px; opacity:.8; width:100%; margin-top:5px; font-style:italic;';
          n.textContent = slot.note;
          slotEl.appendChild(n);
        }
        scheduleDisplayElement.appendChild(slotEl);
      });

      if (surveyTime.code === 'special') {
        surveyNotesElement.innerHTML = `<strong>⚠️ Case-by-case Assessment Required:</strong><br>
          Properties with 5+ bedrooms require individual assessment.<br>
          <strong>Recommendation:</strong> Book in LAST survey slot and allow extra time.`;
        surveyNotesElement.classList.add('case-by-case-warning');
        estimatedTimeElement.style.background = 'rgba(220,53,69,.1)';
        estimatedTimeElement.style.color = 'var(--danger-color)';
      } else {
        surveyNotesElement.innerHTML = `<strong>Booking Tips:</strong><br>
          1. Remember to adjust survey duration in booking system<br>
          2. Allow travel time between appointments<br>
          3. Check zone-specific times for second survey`;
        surveyNotesElement.classList.remove('case-by-case-warning');
        estimatedTimeElement.style.background = 'rgba(0,123,255,.1)';
        estimatedTimeElement.style.color = 'var(--highlight-color)';
      }

      calculatorZoneElement.textContent = `Detected Zone: ${currentZoneName}`;
    }

    bedroomsSelect.addEventListener('change', updateCalculator);
    livingAreasSelect.addEventListener('change', updateCalculator);

    function checkIfShowCalculator(zoneName, isStartingAddress = true) {
      if (!isStartingAddress) {
        calculatorTrigger.classList.remove('show');
        surveyCalculator.classList.remove('show');
        return;
      }
      const zone = (zoneName || '').toLowerCase();
      let detectedZone = '', zoneDisplayName = '', shouldShow = false;

      if (zone.includes('wellington') && !zone.includes('auckland')) {
        if (zone.includes('zone 1'))       { shouldShow = true; detectedZone = 'Zone 1';  zoneDisplayName = 'Zone 1 (Wellington)'; }
        else if (zone.includes('zone 2a')) { shouldShow = true; detectedZone = 'Zone 2A'; zoneDisplayName = 'Zone 2A (Wellington)'; }
        else if (zone.includes('zone 2b')) { shouldShow = true; detectedZone = 'Zone 2B'; zoneDisplayName = 'Zone 2B (Wellington)'; }
        else if (zone.includes('zone 3'))  { shouldShow = true; detectedZone = 'Zone 3';  zoneDisplayName = 'Zone 3 (Wellington)'; }
        else if (zone.includes('zone 4'))  { shouldShow = true; detectedZone = 'Zone 4';  zoneDisplayName = 'Zone 4 (Wellington)'; }
        else if (zone.includes('zone 5'))  { shouldShow = true; detectedZone = 'Zone 5';  zoneDisplayName = 'Zone 5 (Wellington)'; }
      }

      if (shouldShow) {
        currentZoneForCalculator = detectedZone;
        currentZoneName = zoneDisplayName || zone;
        calculatorTrigger.classList.add('show');
        surveyCalculator.classList.add('show');
        updateCalculator();

        const zoneInfo = document.getElementById('zone-info');
        if (zoneInfo && !document.getElementById('survey-note')) {
          const note = document.createElement('div');
          note.id = 'survey-note';
          note.style.cssText = 'font-size:16px; margin-top:10px; color:var(--highlight-color);';
          note.innerHTML = '💡 <strong>Survey calculator active</strong> - Check recommended booking slot';
          zoneInfo.appendChild(note);
        }
      } else {
        calculatorTrigger.classList.remove('show');
        surveyCalculator.classList.remove('show');
        currentZoneForCalculator = null;
        currentZoneName = '';
        const note = document.getElementById('survey-note');
        if (note) note.remove();
      }
    }

    // ============ BOOT ============
    window.addEventListener('DOMContentLoaded', () => {
      initMap();
      setupAutocomplete('address', 'address-autocomplete');
      setupAutocomplete('to', 'to-autocomplete');
    });
  </script>
</body>
</html>
